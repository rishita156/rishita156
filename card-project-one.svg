<svg xmlns="http://www.w3.org/2000/svg" width="560" height="250" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
<title id="title">Rishita Shah</title>
<desc id="desc">Illustrative animated orbit rings with a glowing satellite.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081527"/><stop offset=".58" stop-color="#132b55"/><stop offset="1" stop-color="#19183d"/></linearGradient>
  <linearGradient id="ring" x2="1"><stop stop-color="#69dcff"/><stop offset="1" stop-color="#ad92ff"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#61baff" stop-opacity=".36"/><stop offset="1" stop-color="#61baff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="560" height="250" rx="16" fill="url(#bg)"/>
<circle cx="440" cy="125" r="112" fill="url(#halo)">
  <animate attributeName="r" values="100;120;100" dur="8s" repeatCount="indefinite"/>
</circle>
<text x="26" y="35" fill="#8dc8ff" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CATEGORY · TECHNOLOGY</text>
<text x="26" y="82" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800">Rishita</text>
<text x="26" y="117" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800">Shah</text>
<text x="26" y="159" fill="#bdd0e8" font-family="Arial,Helvetica,sans-serif" font-size="13">One-line description of the project</text>
<path d="M26 179 H292" stroke="#6ea6ff" stroke-width="1.6" opacity=".5"/>
<text x="26" y="219" fill="#80a9db" font-family="Arial,Helvetica,sans-serif" font-size="12">Python · Flask · SQLite</text>
<g transform="translate(440 125)" fill="none" stroke="url(#ring)" stroke-width="1.8">
  <ellipse rx="95" ry="34" transform="rotate(-20)" opacity=".9"/>
  <ellipse rx="95" ry="34" transform="rotate(40)" opacity=".7"/>
  <ellipse rx="95" ry="34" transform="rotate(100)" opacity=".5"/>
</g>
<circle cx="440" cy="125" r="16" fill="#b6e5ff" stroke="#214778" stroke-width="3"/>
<circle cx="440" cy="125" r="6" fill="#88e9ff">
  <animate attributeName="r" values="6;10;6" dur="3.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".9;.4;.9" dur="3.8s" repeatCount="indefinite"/>
</circle>
<g fill="#75edff">
  <circle r="5"><animateMotion dur="6s" repeatCount="indefinite" path="M345 125 A95 34 0 1 1 535 125 A95 34 0 1 1 345 125"/></circle>
  <circle r="4" fill="#c3b3ff"><animateMotion dur="9s" repeatCount="indefinite" path="M360 100 A95 34 0 1 0 520 150 A95 34 0 1 0 360 100"/></circle>
</g>
</svg>